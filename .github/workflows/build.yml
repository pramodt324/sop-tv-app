name: Build APK
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        pip3 install --user --upgrade buildozer cython==0.29.36 virtualenv

    - name: Pre-Accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # Automatically accept all standard Android licenses beforehand
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n244d2d9e8db31f47beba41de14fb7d313cd95763" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Build Android APK
      run: |
        export PATH=$PATH:$HOME/.local/bin
        # Force buildozer to automatically accept all runtime prompts
        buildozer android debug || (yes | buildozer android debug)

    - name: Upload Finished APK File
      uses: actions/upload-artifact@v4
      with:
        name: SOP-TV-App-Package
        path: bin/*.apk

      

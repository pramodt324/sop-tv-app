name: Build APK
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        pip3 install --user --upgrade buildozer cython==0.29.36 virtualenv

    - name: Build Android APK with Buildozer
      run: |
        export PATH=$PATH:$HOME/.local/bin
        yes | buildozer android debug

    - name: Upload Finished APK File
      uses: actions/upload-artifact@v4
      with:
        name: SOP-TV-App-Package
        path: bin/*.apk


      
